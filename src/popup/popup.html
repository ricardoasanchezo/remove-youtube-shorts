<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remove Youtube Shorts</title>
    <style>
        :root {
            --primary: #ff0000;
            --bg: #0f0f0f;
            --card-bg: #212121;
            --text: #f1f1f1;
            --text-secondary: #aaa;
        }
        body {
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 16px;
            width: 240px;
            background: var(--bg);
            color: var(--text);
        }
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 14px;
            margin: 0;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .value {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Remove Youtube Shorts</h1>
    </div>
    <div class="card">
        <div class="stat-row">
            <span class="label">Shorts Sections Removed</span>
            <span id="counter" class="value">0</span>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
